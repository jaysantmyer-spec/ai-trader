name: weekly backtest
on:
  schedule:
    - cron: "30 6 * * 1"     # Mondays 06:30 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pipeline
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ai_trader backtest
      - run: |
          git config user.name "ai-trader bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "backtest: $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash origin main || true
          git push
