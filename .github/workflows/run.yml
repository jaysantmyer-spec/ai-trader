name: hourly run
on:
  schedule:
    - cron: "7 * * * *"      # every hour at :07 (bars close on the hour)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        run: python -m ai_trader run
      - name: Commit results
        run: |
          git config user.name "ai-trader bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data models
          git diff --cached --quiet || git commit -m "run: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin main || true
          git push
